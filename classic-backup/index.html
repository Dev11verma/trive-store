    <span>Get VIP Early Access + <strong>FIRST50 (38% OFF)</strong> alert:</span>
    <form id="trive-vip-form" onsubmit="submitTriveVipLead(event)" style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:0;">
      <input id="vip-contact" type="text" required placeholder="WhatsApp or @instagram" style="padding:7px 10px;border-radius:6px;border:1px solid #333;background:#171717;color:#fff;font-size:14px;min-width:190px;" />
      <button type="submit" style="padding:7px 14px;border-radius:6px;border:none;background:#d7ff3e;color:#0a0a0a;font-weight:800;cursor:pointer;">Join VIP</button>
    </form>
    <span id="vip-msg" style="font-size:12px;color:#22c55e;display:none;">You're on the Drop 01 VIP list!</span>
  </div>
</div>
<script>
async function submitTriveVipLead(e) {
  e.preventDefault();
  const input = document.getElementById('vip-contact');
  const msg = document.getElementById('vip-msg');
  const contact = (input?.value || '').trim();
  if (!contact) return;
  try {
    const endpoint = (typeof API_URL === 'string') ? API_URL : 'https://trive-api.onrender.com/api/order';
    await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        customer: { name: 'VIP Lead (' + contact + ')', phone: contact, email: 'support.trive@gmail.com' },
        address: { street: 'VIP Drop 01 Waitlist', city: 'Bhopal', state: 'Madhya Pradesh', pincode: '462001' },
        product: { name: 'VIP Drop 01 Early Access', sku: 'VIP-DROP01-WAITLIST', price: 0 },
        items: [{ name: 'VIP Drop 01 Early Access', sku: 'VIP-DROP01-WAITLIST', price: 0, quantity: 1 }],
        totalAmount: 0,
        paymentMode: 'VIP_LEAD',
        utr: 'VIP_WAITLIST'
      })
    });
  } catch (err) {}
  if (input) input.value = '';
  if (typeof gtag === 'function') gtag('event', 'generate_lead', { event_category: 'VIP_Waitlist', event_label: 'DROP_01_DEC_1' });
  if (msg) msg.style.display = 'inline';
}
</script>

<script src="app.js"></script>

    <!-- 3. Load Modular HTML Parts & Trigger Store Render After DOM Injection -->
    <script>
        async function loadPart(slotId, filename) {
            try {
                const res = await fetch(filename);
                if (!res.ok) throw new Error(`Failed to load ${filename} (${res.status})`);
                const slot = document.getElementById(slotId);
                if (slot) slot.innerHTML = await res.text();
            } catch (err) {
                console.error(`[TRIVÉ Loader Error]`, err);
            }
        }

        document.addEventListener("DOMContentLoaded", async () => {
            await Promise.all([
                loadPart('slot-header', 'header.html'),
                loadPart('slot-catalog', 'catalog-view.html'),
                loadPart('slot-checkout', 'checkout-views.html'),
                loadPart('slot-footer', 'footer.html')
            ]);

            if (typeof renderCatalog === 'function') renderCatalog();
            if (typeof updateCartUI === 'function') updateCartUI();
            if (typeof startDealTimer === 'function') startDealTimer();
        });
    </script>
