﻿<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="assets/Main/fevicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRIVÉ // ARCHIVAL HEAVYWEAR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Syne:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Modular Ingestion Slots -->
    <div id="slot-header"></div>
    <div id="slot-catalog"></div>
    <div id="slot-checkout"></div>
    <div id="slot-footer"></div>

    <!-- 1. Load Product Catalog & Assets Data FIRST -->
    <script src="products.js"></script>

    <!-- 2. Load Main Store Logic, Cart & Checkout Dispatch SECOND -->
    <script src="app.js"></script>

    <!-- 3. Load Modular HTML Parts & Trigger Store Render After DOM Injection -->
    <script>
        async function loadPart(slotId, filename) {
            try {
                const res = await fetch(filename);
                if (!res.ok) throw new Error(`Failed to load ${filename} (${res.status})`);
                const slot = document.getElementById(slotId);
                if (slot) slot.innerHTML = await res.text();
            } catch (err) {
                console.error(`[TRIVÉ Loader Error]`, err);
            }
        }

        document.addEventListener("DOMContentLoaded", async () => {
            await Promise.all([
                loadPart('slot-header', 'header.html'),
                loadPart('slot-catalog', 'catalog-view.html'),
                loadPart('slot-checkout', 'checkout-views.html'),
                loadPart('slot-footer', 'footer.html')
            ]);

            if (typeof renderCatalog === 'function') renderCatalog();
            if (typeof updateCartUI === 'function') updateCartUI();
            if (typeof startDealTimer === 'function') startDealTimer();
        });
    </script>
</body>
</html>
