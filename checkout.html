<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TRIVÉ // Checkout</title>
  <link rel="icon" type="image/png" href="assets/Main/fevicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F5F0E6;
      --card: #EFE9DD;
      --ink: #221D19;
      --muted: #6E655C;
      --line: rgba(34, 29, 25, 0.32);
      --line-soft: rgba(34, 29, 25, 0.16);
      --vermilion: #9E2A2B;
      --vermilion-dark: #822021;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }
    .engrave-side {
      position: fixed;
      top: 0;
      bottom: 0;
      width: 185px;
      pointer-events: none;
      opacity: 0.25;
      z-index: 0;
    }
    .engrave-side.left { left: 0; }
    .engrave-side.right { right: 0; transform: scaleX(-1); }
    .page-shell {
      position: relative;
      z-index: 1;
      max-width: 960px;
      margin: 0 auto;
      padding: 26px 24px 56px;
    }
    .top-back {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
      margin-bottom: 8px;
    }
    .top-back:hover { color: var(--ink); }
    .brand-head { text-align: center; margin-bottom: 34px; }
    .brand-mark {
      display: inline-flex;
      align-items: flex-end;
      gap: 6px;
      text-decoration: none;
      color: var(--ink);
    }
    .brand-mark .word {
      font-family: 'Cinzel', serif;
      font-size: clamp(2.2rem, 4vw, 3rem);
      font-weight: 700;
      letter-spacing: 0.14em;
      line-height: 1;
    }
    .brand-seal {
      background: var(--vermilion);
      color: #F5F0E6;
      font-size: 9px;
      font-weight: 800;
      padding: 3px 5px;
      border-radius: 3px;
      line-height: 1.05;
      margin-bottom: 3px;
    }
    .page-title {
      font-family: 'Cinzel', serif;
      font-size: 21px;
      font-weight: 600;
      letter-spacing: 0.14em;
      margin-top: 12px;
    }
    .co-grid {
      display: grid;
      grid-template-columns: 1.35fr 0.85fr;
      gap: 36px;
      align-items: start;
    }
    .sec-lbl {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #3A2622;
      text-transform: uppercase;
      margin: 22px 0 10px;
    }
    .sec-lbl:first-child { margin-top: 0; }
    .arch-input, .arch-select {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 12px;
      background: rgba(255, 255, 255, 0.36);
      border: 1px solid var(--line);
      border-radius: 6px;
      font-family: inherit;
      font-size: 14px;
      color: var(--ink);
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }
    .arch-input:focus, .arch-select:focus {
      border-color: var(--vermilion);
      background: rgba(255, 255, 255, 0.75);
    }
    .arch-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .summary-card {
      border: 1px solid var(--line-soft);
      background: rgba(239, 233, 221, 0.58);
      border-radius: 8px;
      padding: 22px;
    }
    .summary-card h2 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line-soft);
      margin-bottom: 14px;
    }
    .sum-item {
      padding: 8px 0 10px;
      border-bottom: 3px solid rgba(34, 29, 25, 0.14);
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      font-size: 13px;
    }
    .sum-item small {
      display: block;
      color: var(--muted);
      font-size: 11px;
      margin-top: 2px;
    }
    .sum-totals {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid var(--line-soft);
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 13px;
    }
    .sum-line { display: flex; justify-content: space-between; }
    .sum-grand {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-top: 8px;
      padding-top: 10px;
      border-top: 1px solid var(--line-soft);
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .cta-wrap { text-align: center; margin-top: 34px; }
    .btn-complete {
      background: var(--vermilion);
      color: #F5F0E6;
      border: none;
      border-radius: 6px;
      padding: 15px 46px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(158, 42, 43, 0.22);
      transition: background 0.2s, transform 0.15s;
    }
    .btn-complete:hover {
      background: var(--vermilion-dark);
      transform: translateY(-1px);
    }
    @media (max-width: 960px) { .engrave-side { width: 90px; opacity: 0.14; } }
    @media (max-width: 780px) { .engrave-side { display: none; } .co-grid, .arch-row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <svg class="engrave-side left" viewBox="0 0 180 900" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <path d="M0 0 C95 45 145 115 110 195 C85 245 35 230 55 170 C70 125 125 145 115 210" stroke="#5A4F45" stroke-width="1.3"/>
    <circle cx="35" cy="310" r="88" stroke="#5A4F45" stroke-width="1.1"/><circle cx="35" cy="310" r="64" stroke="#5A4F45" stroke-width="1" stroke-dasharray="4 4"/><circle cx="35" cy="310" r="40" stroke="#5A4F45" stroke-width="1.1"/>
    <rect x="12" y="405" width="76" height="14" rx="2" stroke="#5A4F45" stroke-width="1.2"/><rect x="20" y="419" width="60" height="270" stroke="#5A4F45" stroke-width="1.2"/>
    <line x1="35" y1="419" x2="35" y2="689" stroke="#5A4F45" stroke-width="1"/><line x1="50" y1="419" x2="50" y2="689" stroke="#5A4F45" stroke-width="1"/><line x1="65" y1="419" x2="65" y2="689" stroke="#5A4F45" stroke-width="1"/>
    <circle cx="35" cy="790" r="105" stroke="#5A4F45" stroke-width="1.2"/><circle cx="35" cy="790" r="76" stroke="#5A4F45" stroke-width="1"/><circle cx="35" cy="790" r="46" stroke="#5A4F45" stroke-width="1.1" stroke-dasharray="3 3"/>
  </svg>
  <svg class="engrave-side right" viewBox="0 0 180 900" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <path d="M0 0 C95 45 145 115 110 195 C85 245 35 230 55 170 C70 125 125 145 115 210" stroke="#5A4F45" stroke-width="1.3"/>
    <circle cx="35" cy="310" r="88" stroke="#5A4F45" stroke-width="1.1"/><circle cx="35" cy="310" r="64" stroke="#5A4F45" stroke-width="1" stroke-dasharray="4 4"/><circle cx="35" cy="310" r="40" stroke="#5A4F45" stroke-width="1.1"/>
    <rect x="12" y="405" width="76" height="14" rx="2" stroke="#5A4F45" stroke-width="1.2"/><rect x="20" y="419" width="60" height="270" stroke="#5A4F45" stroke-width="1.2"/>
    <line x1="35" y1="419" x2="35" y2="689" stroke="#5A4F45" stroke-width="1"/><line x1="50" y1="419" x2="50" y2="689" stroke="#5A4F45" stroke-width="1"/><line x1="65" y1="419" x2="65" y2="689" stroke="#5A4F45" stroke-width="1"/>
    <circle cx="35" cy="790" r="105" stroke="#5A4F45" stroke-width="1.2"/><circle cx="35" cy="790" r="76" stroke="#5A4F45" stroke-width="1"/><circle cx="35" cy="790" r="46" stroke="#5A4F45" stroke-width="1.1" stroke-dasharray="3 3"/>
  </svg>

  <div class="page-shell">
    <a href="index.html" class="top-back">← Back to Store</a>
    <header class="brand-head">
      <a href="index.html" class="brand-mark"><span class="word">TRIVÉ</span><span class="brand-seal">त्रि<br>वे</span></a>
      <h1 class="page-title">CHECKOUT</h1>
    </header>

    <form id="co-form" onsubmit="proceedToPayment(event)">
      <div class="co-grid">
        <div>
          <div class="sec-lbl">CONTACT</div>
          <input class="arch-input" id="co-name" required placeholder="First & Last Name" />
          <div class="arch-row">
            <input class="arch-input" id="co-email" type="email" required placeholder="Email Address" />
            <input class="arch-input" id="co-phone" type="tel" required placeholder="Mobile Number (WhatsApp)" />
          </div>

          <div class="sec-lbl">SHIPPING</div>
          <input class="arch-input" id="co-addr" required placeholder="Street Address / House / Landmark" />
          <div class="arch-row">
            <input class="arch-input" id="co-city" required placeholder="City" />
            <input class="arch-input" id="co-pin" required pattern="[0-9]{6}" placeholder="PIN Code (6 digits)" />
          </div>

          <div class="sec-lbl">PAYMENT</div>
          <select class="arch-select" id="co-mode" onchange="renderSummary()">
            <option value="UPI">Instant UPI / QR — ₹0 Shipping &amp; Handling</option>
            <option value="COD">Cash on Delivery (COD) — +₹149 Handling Fee</option>
          </select>
        </div>

        <aside class="summary-card">
          <h2>ORDER SUMMARY</h2>
          <div id="co-items"></div>
          <div class="sum-totals">
            <div class="sum-line"><span>SUBTOTAL</span><span id="co-sub">₹0</span></div>
            <div class="sum-line"><span>Shipping &amp; Handling</span><span id="co-fee">FREE (₹0)</span></div>
            <div class="sum-grand"><span>GRAND TOTAL</span><span id="co-total">₹0</span></div>
          </div>
        </aside>
      </div>

      <div class="cta-wrap">
        <button type="submit" class="btn-complete">COMPLETE ORDER</button>
      </div>
    </form>
  </div>

  <script>
    const bag = JSON.parse(localStorage.getItem("trive_cart") || localStorage.getItem("nw_trive_bag") || "[]");
    const saved = JSON.parse(localStorage.getItem("trive_shipping") || "null");
    if (saved) ["name","email","phone","addr","city","pin"].forEach(k => { const el = document.getElementById("co-" + k); if (el && saved[k]) el.value = saved[k]; });
    const pm = localStorage.getItem("trive_pay_mode");
    if (pm && document.getElementById("co-mode")) document.getElementById("co-mode").value = pm;

    function renderSummary() {
      const mode = document.getElementById("co-mode").value;
      document.getElementById("co-items").innerHTML = bag.length
        ? bag.map((i, idx) => `<div class="sum-item"><div><strong>${i.name || ("ITEM " + (idx + 1))}</strong><small>${i.color || "Standard"} • Size ${i.size || "L"} × ${i.quantity || 1}</small></div><strong>₹${Number(i.price) * (Number(i.quantity) || 1)}</strong></div>`).join("")
        : `<p style="font-size:13px;color:var(--muted);">Your bag is empty. <a href="index.html" style="color:var(--vermilion);">Return to store</a>.</p>`;
      const sub = bag.reduce((s, i) => s + Number(i.price) * (Number(i.quantity) || 1), 0);
      const fee = (mode === "COD" && sub > 0) ? 149 : 0;
      document.getElementById("co-sub").textContent = "₹" + sub;
      document.getElementById("co-fee").textContent = fee === 0 ? "FREE (₹0)" : "₹" + fee;
      document.getElementById("co-total").textContent = "₹" + (sub + fee);
    }

    function proceedToPayment(e) {
      e.preventDefault();
      if (!bag.length) return alert("Your bag is empty.");
      const mode = document.getElementById("co-mode").value;
      const sub = bag.reduce((s, i) => s + Number(i.price) * (Number(i.quantity) || 1), 0);
      const fee = mode === "COD" ? 149 : 0;
      const ship = {
        name: document.getElementById("co-name").value.trim(),
        email: document.getElementById("co-email").value.trim(),
        phone: document.getElementById("co-phone").value.trim(),
        addr: document.getElementById("co-addr").value.trim(),
        city: document.getElementById("co-city").value.trim(),
        pin: document.getElementById("co-pin").value.trim()
      };
      localStorage.setItem("trive_shipping", JSON.stringify(ship));
      localStorage.setItem("trive_payment_draft", JSON.stringify({ mode, subtotal: sub, fee, total: sub + fee, items: bag, shipping: ship }));
      location.href = "payment.html";
    }
    renderSummary();
  </script>
</body>
</html>
